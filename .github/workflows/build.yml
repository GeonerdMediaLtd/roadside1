name: Build APK

on:
  push:
    branches: [main, autospeaker]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk AutoSpeaker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSpeaker-apk
          path: AutoSpeaker.apk

      - name: Publish as a release (easy download from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autospeaker-latest
          name: Auto Speaker – latest build
          body: Download AutoSpeaker.apk below and open it on your Android phone.
          files: AutoSpeaker.apk
          make_latest: false
